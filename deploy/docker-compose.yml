# Запуск: поставте свій домен у deploy/Caddyfile, потім `docker compose -f deploy/docker-compose.yml up -d --build`
# (запускати з кореня проєкту). Caddy сам отримає HTTPS-сертифікат.
services:
  uelt:
    build: ..
    restart: unless-stopped
    # Сповіщення на пошту (реєстрація/видалення користувачів). Для Gmail потрібен «пароль застосунку».
    # Значення краще винести у файл deploy/.env (docker compose підхопить його автоматично).
    environment:
      UELT_SMTP_HOST: ${UELT_SMTP_HOST:-}
      UELT_SMTP_PORT: ${UELT_SMTP_PORT:-465}
      UELT_SMTP_USER: ${UELT_SMTP_USER:-}
      UELT_SMTP_PASS: ${UELT_SMTP_PASS:-}
      UELT_SMTP_FROM: ${UELT_SMTP_FROM:-}
      UELT_NOTIFY_TO: ${UELT_NOTIFY_TO:-elpasher.game@gmail.com}
    volumes:
      - uelt-data:/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [uelt]
volumes:
  uelt-data:
  caddy-data:
